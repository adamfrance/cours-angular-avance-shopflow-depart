@if (page$ | async; as page) {
  <div class="table">
    <table class="tableau">
      <thead>
        <tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Valeur</th><th>État</th></tr>
      </thead>
      <tbody>
        @for (p of page.products; track p.id) {
          <tr>
            <td>{{ p.title }}</td>
            <td>{{ p.category }}</td>
            <td>{{ p.price | currency: 'EUR' }}</td>
            <td>{{ p.stock }}</td>
            <td>{{ p.price * p.stock | currency: 'EUR' }}</td>
            <td>{{ p.stock | etatStock }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <p class="info">Chargement du stock…</p>
}
